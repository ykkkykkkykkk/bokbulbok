<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>핀볼 뽑기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
</head>
<body>
<style>
/* Layout: control panel on the left, tall neon cabinet with a following camera on the right; stacks on phones. Single committed dark arcade look. */
:root{
  --bg:#06071a;
  --panel:#0d1030;
  --line:#2a2f6e;
  --fg:#f3f4ff;
  --muted:#9aa0d8;
  --neon:#00f0ff;
  --pink:#ff2d95;
  --gold:#ffd400;
  --lime:#8cff3a;
  --font-display:"Black Han Sans","Noto Sans KR",sans-serif;
  --font-body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);
  background-image:
    radial-gradient(ellipse at 20% 0%,rgba(255,45,149,.18),transparent 55%),
    radial-gradient(ellipse at 90% 100%,rgba(0,240,255,.14),transparent 50%);
  min-height:100%;}
.app{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;max-width:1180px;margin:0 auto;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
@media (max-width:820px){.app{grid-template-columns:1fr}}
h1{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1;margin:0;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--neon),#fff 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(0,240,255,.45));text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;align-self:start}
label.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}
textarea,input[type=number],select{width:100%;box-sizing:border-box;background:#070919;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.5 var(--font-body)}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--neon);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.map{background:#070919;border:1px solid var(--line);border-radius:10px;padding:10px 6px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3}
.map[aria-pressed=true]{border-color:var(--neon);color:#fff;box-shadow:0 0 0 1px var(--neon) inset,0 0 14px rgba(0,240,255,.35)}
.btn{border:0;border-radius:12px;padding:13px 16px;font:900 15px var(--font-body);cursor:pointer;color:#06071a;flex:1;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.shuffle{background:var(--gold);box-shadow:0 0 18px rgba(255,212,0,.4)}
.btn.start{background:var(--lime);box-shadow:0 0 18px rgba(140,255,58,.4)}
.btn.start.stop{background:var(--pink);color:#fff;box-shadow:0 0 18px rgba(255,45,149,.5)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);flex:0 0 auto;padding:13px 14px}
.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:#070919;border:1px solid var(--line);color:var(--muted)}
.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.status b{color:var(--neon);font-family:var(--font-display);font-weight:400;font-size:18px}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:240px;overflow:auto;font-variant-numeric:tabular-nums}
.results li{display:flex;align-items:center;gap:10px;background:#070919;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px}
.results .rank{font-family:var(--font-display);width:36px;color:var(--muted)}
.results .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:0 0 auto}
.results li.win{border-color:var(--gold);box-shadow:0 0 14px rgba(255,212,0,.35)}
.results li.win .rank{color:var(--gold)}
.results .empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);justify-content:center}

.stage{position:relative;min-width:0}
.cabinet{position:relative;margin:0 auto;width:min(100%,560px);aspect-ratio:3/5;max-width:100%;border-radius:22px;padding:10px;box-sizing:border-box;overflow:hidden;
  background:linear-gradient(180deg,#1a1f5c,#0b0d2c);border:2px solid #3a3f8a;
  box-shadow:0 0 0 6px #090b24,0 0 40px rgba(0,240,255,.25),0 0 90px rgba(255,45,149,.18),inset 0 0 30px rgba(0,0,0,.6)}
.cabinet.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
canvas#board{display:block;width:100%;height:100%;border-radius:14px;background:#04051a}
.flash{position:absolute;inset:0;border-radius:22px;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.tense{position:absolute;inset:10px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:inset 0 0 90px rgba(255,45,149,.75),inset 0 0 30px rgba(255,0,60,.6)}
.tense.on{opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 140px rgba(255,45,149,.95),inset 0 0 40px rgba(255,0,60,.8)}}
.tense span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:26px;letter-spacing:.25em;color:#fff;text-shadow:0 0 16px var(--pink),0 0 30px var(--pink);white-space:nowrap}
.winner[hidden]{display:none}
.winner{position:absolute;inset:0;display:grid;place-items:center;border-radius:22px;background:rgba(4,5,26,.72);backdrop-filter:blur(3px)}
.winner .card{text-align:center;padding:28px 34px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.winner .eyebrow{font-family:var(--font-display);font-size:22px;color:var(--gold);letter-spacing:.2em;text-shadow:0 0 18px rgba(255,212,0,.8)}
.winner .name{font-family:var(--font-display);font-size:clamp(48px,12vw,86px);line-height:1.05;margin:8px 0;text-shadow:0 0 30px currentColor,0 0 60px currentColor;word-break:keep-all}
.winner .meta{color:#fff;font-weight:700;font-size:15px}
.winner button{margin-top:18px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.cabinet.shake,.tense.on{animation:none}.winner .card{animation:none}}
</style>

<div class="app">
  <aside class="panel">
    <div>
      <h1>핀볼 뽑기</h1>
    </div>

    <div>
      <label class="lbl" for="names">참가자</label>
      <textarea id="names">민재*2, 수빈, 지훈*3, 예은, 현우, 서윤*2, 태양, 하린</textarea>
      <p class="hint">이름*3 → 공 3개</p>
      <div class="row" style="margin-top:8px">
        <span style="font-size:13px;color:var(--muted)">1 ~</span>
        <input type="number" id="rangeN" value="20" min="2" max="300" style="width:84px">
        <button class="btn ghost" id="fillRange" type="button">숫자로 채우기</button>
      </div>
    </div>

    <div>
      <label class="lbl">맵</label>
      <div class="maps" role="group">
        <button class="map" type="button" data-map="wheel" aria-pressed="true">운명의<br>수레바퀴</button>
        <button class="map" type="button" data-map="bubble" aria-pressed="false">버블<br>범퍼</button>
        <button class="map" type="button" data-map="zigzag" aria-pressed="false">지그재그<br>계단</button>
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label class="lbl" for="rankMode">당첨 순위</label>
        <select id="rankMode">
          <option value="first">첫 번째 골인</option>
          <option value="last">마지막 골인</option>
          <option value="n">N번째 골인</option>
        </select>
      </div>
      <div style="width:84px">
        <label class="lbl" for="rankN">N</label>
        <input type="number" id="rankN" value="3" min="1">
      </div>
    </div>

    <div class="row">
      <button class="btn shuffle" id="shuffle" type="button">섞기</button>
      <button class="btn start" id="start" type="button">시작</button>
      <button class="btn ghost" id="reset" type="button">초기화</button>
    </div>
    <div>
      <label class="lbl">난입</label>
      <div class="row">
        <label class="chip" style="cursor:pointer"><input type="checkbox" id="rider" checked> 달달달달 라이더</label>
        <label class="chip" style="cursor:pointer"><input type="checkbox" id="sabakOn" checked> 썩박궤</label>
      </div>
    </div>
    <div>
      <label class="lbl" for="bgmVol">브금</label>
      <div class="row">
        <button class="btn ghost" id="bgmToggle" type="button" style="padding:8px 12px;font-size:12px">재생</button>
        <input type="range" id="bgmVol" min="0" max="100" value="45" style="flex:1;accent-color:var(--neon)" aria-label="브금 볼륨">
        <span id="bgmVolLabel" style="font-size:12px;color:var(--muted);width:34px;text-align:right;font-variant-numeric:tabular-nums">45%</span>
      </div>
    </div>
    <div class="row">
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="sound" checked> 효과음</label>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="slowmo" checked> 슬로모션</label>
      <button class="btn ghost" id="fs" type="button" style="padding:6px 10px;font-size:12px">전체화면</button>
    </div>

    <div class="status"><span>상태 <b id="state">준비</b></span><span>공 <b id="count">0</b></span></div>

    <div>
      <label class="lbl">골인 순서</label>
      <ol class="results" id="results"><li class="empty">골인 없음</li></ol>
    </div>
  </aside>

  <main class="stage">
    <div class="cabinet" id="cabinet">
      <canvas id="board"></canvas>
      <div class="tense" id="tense"><span>마지막 한 공</span></div>
      <div class="flash" id="flash"></div>
      <div class="winner" id="winner" hidden>
        <div class="card">
          <div class="eyebrow">당첨</div>
          <div class="name" id="winName">철수</div>
          <div class="meta" id="winMeta">1번째 골인</div>
          <button class="btn shuffle" id="again" type="button">다시 뽑기</button>
        </div>
      </div>
    </div>
  </main>
</div>
<canvas id="fx"></canvas>
<audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
<audio id="daldal" src="assets/daldal8.mp3" preload="auto"></audio>

<script src="assets/matter.min.js"></script>
<script>
(function(){
const {Engine,Bodies,Body,Composite,Events,Vector}=Matter;
const W=600,H=2068,VH=1000,R=11;          // board 600×1700, camera window 600×1000
const GATE_Y=118,FINISH_Y=2020;
const RING={x:W/2,y:1890,r:64,gapHalf:0.8,spd:0.021};
const PALETTE=['#00f0ff','#ff2d95','#ffd400','#8cff3a','#ff7a1a','#b388ff','#ff4d4d','#3dffc5','#ff9ad5','#7cc4ff','#ffe08a','#c8ff8a'];

const $=id=>document.getElementById(id);
const canvas=$('board'),ctx=canvas.getContext('2d');
const fx=$('fx'),fctx=fx.getContext('2d');
let dpr=Math.min(window.devicePixelRatio||1,2);

let engine,world,balls=[],obstacles=[],spinners=[],movers=[],ring,gate,finished=[],particles=[],confetti=[],shocks=[],texts=[];
let state='ready',map='wheel',shuffleUntil=0,winnerDone=false,last=0;
let cam={y:0,x:0,zoom:1},timeScale=1,tense=false,heartAt=0;
let riders=[],riderWarn=null,nextRiderAt=0,engineNode=null;
let sabak=null,nextSabakAt=0,shake={x:0,y:0};
try{document.fonts&&document.fonts.load('400 40px "Jua"');}catch(e){}
const sabakImg=new Image();sabakImg.src='assets/sabak_cut.png';
const LANES=[470,690,1010,1250,1450,1620];
let prerender=null,audio=null,lastTick=0;

/* ---------- sizing ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
  fx.width=Math.round(innerWidth*dpr);fx.height=Math.round(innerHeight*dpr);
  buildPrerender();
}
addEventListener('resize',resize);

/* ---------- parsing ---------- */
function parseNames(){
  const raw=$('names').value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const out=[];const colorOf={};let ci=0;
  raw.forEach(tok=>{
    const m=tok.match(/^(.*?)\s*[*xX×]\s*(\d+)$/);
    const name=m?m[1].trim():tok;const n=m?Math.max(1,Math.min(50,+m[2])):1;
    if(!name)return;
    if(colorOf[name]==null)colorOf[name]=PALETTE[ci++%PALETTE.length];
    for(let i=0;i<n;i++)out.push({name,color:colorOf[name]});
  });
  return out.slice(0,300);
}

/* ---------- world ---------- */
function makeObstacle(body,kind,color){body.label=kind;body.plugin={kind,color,flash:0};obstacles.push(body);return body;}
function wall(x,y,w,h,angle,draw){const b=Bodies.rectangle(x,y,w,h,{isStatic:true,angle:angle||0,label:'wall',restitution:.4});if(draw){b.plugin={kind:'wall',color:'#4af6ff',flash:0};obstacles.push(b);}Composite.add(world,b);return b;}
function spinner(x,y,arms,len,spd,color){
  const parts=[];for(let i=0;i<arms;i++){parts.push(Bodies.rectangle(x,y,len*2,14,{angle:Math.PI*i/arms}));}
  const b=Body.create({parts,isStatic:true,label:'spinner'});Body.setPosition(b,{x,y});
  b.plugin={kind:'spinner',spd,arms,len,color:color||'#ff2d95',flash:0};spinners.push(b);obstacles.push(b);Composite.add(world,b);return b;
}
function peg(x,y,r,rest){Composite.add(world,makeObstacle(Bodies.circle(x,y,r||6,{isStatic:true,restitution:rest==null?.5:rest}),'peg','#00f0ff'));}

function buildMap(){
  obstacles=[];spinners=[];movers=[];
  wall(-20,H/2,40,H*2);wall(W+20,H/2,40,H*2);wall(W/2,-20,W*2,40);
  gate=Bodies.rectangle(W/2,GATE_Y,W,10,{isStatic:true,label:'gate'});Composite.add(world,gate);

  /* zones 1-3 (190–1700) differ per map; zone 4 (gate ring) is shared */
  const bumper=(x,y,r,col,rest)=>Composite.add(world,makeObstacle(Bodies.circle(x,y,r,{isStatic:true,restitution:rest||1.4}),'bumper',col));
  const ramp=(x,y,len,ang)=>{const bar=Bodies.rectangle(0,0,len,14,{isStatic:true,angle:ang,label:'ramp'});Body.setPosition(bar,{x,y});bar.plugin={kind:'ramp',color:'#b388ff',flash:0};obstacles.push(bar);Composite.add(world,bar);};
  const paddle=(y,len,amp,spd,phase)=>{const b=Bodies.rectangle(W/2,y,len,16,{isStatic:true,label:'paddle'});b.plugin={kind:'paddle',color:'#8cff3a',flash:0,amp,spd,phase,len};movers.push(b);obstacles.push(b);Composite.add(world,b);};

  if(map==='wheel'){
    /* A. 운명의 수레바퀴: peg field + spinners → bottleneck bowl → long staircase */
    const pegs=[];
    for(let r=0;r<9;r++){const y=195+r*64;const off=(r%2)*31;
      for(let c=0;c<9;c++){const x=52+off+c*62;if(x>W-30)continue;pegs.push({x,y});}}
    const sp=[{x:190,y:420,arms:3,len:80,spd:.028},{x:430,y:620,arms:4,len:70,spd:-.034}];
    sp.forEach(s=>spinner(s.x,s.y,s.arms,s.len,s.spd));
    pegs.filter(p=>!sp.some(s=>Math.hypot(p.x-s.x,p.y-s.y)<s.len+28)).forEach(p=>peg(p.x,p.y));
    wall(119,914,340,20,.42,true);wall(W-119,914,340,20,-.42,true);spinner(W/2,878,2,30,.09,'#ffd400');
    for(let r=0;r<7;r++){const y=1060+r*92;const left=r%2===0;ramp(left?190:W-190,y,380,left?.2:-.2);
      for(let c=0;c<3;c++){const x=left?W-110+c*36:40+c*36;peg(x,y-26,6,.6);}}
    for(let c=0;c<7;c++)peg(60+c*80,1690,6,.6);
  }else if(map==='bubble'){
    /* B. 버블 범퍼: big bumpers → 5-channel bumper tunnel → dense bumper hive with twin spinners (no ramps at all) */
    for(let r=0;r<6;r++){const y=215+r*96;const off=(r%2)*58;
      for(let c=0;c<5;c++){const x=70+off+c*116;if(x>W-40)continue;bumper(x,y,24,PALETTE[(r+c)%PALETTE.length]);}}
    for(let r=0;r<5;r++){const y=263+r*96;const off=((r+1)%2)*58;
      for(let c=0;c<5;c++){const x=70+off+c*116;if(x>W-40)continue;peg(x,y,5);}}
    // tunnel: 4 dividers, bumper at each channel mouth
    for(let i=1;i<=4;i++){wall(i*120,900,14,150,0,true);}
    for(let i=0;i<5;i++)bumper(60+i*120,820,18,PALETTE[(i*3)%PALETTE.length],1.2);
    // hive
    for(let r=0;r<6;r++){const y=1060+r*100;const off=(r%2)*55;
      for(let c=0;c<6;c++){const x=55+off+c*110;if(x>W-30)continue;if(r===2&&(c===1||c===4))continue;if(r===4&&(c===2||c===3))continue;
        bumper(x,y,16,PALETTE[(r*2+c)%PALETTE.length],1.3);}}
    spinner(165,1260,3,70,.04,'#00f0ff');spinner(435,1460,3,70,-.04,'#00f0ff');
    for(let c=0;c<5;c++)bumper(80+c*110,1690,14,'#ffd400',1.2);
  }else{
    /* C. 지그재그 계단: zigzag ramps → twin windmills behind a center divider → moving paddles with slalom pegs */
    for(let r=0;r<6;r++){const y=215+r*94;const left=r%2===0;ramp(left?200:W-200,y,400,left?.17:-.17);
      for(let c=0;c<3;c++){const x=left?W-120+c*38:40+c*38;peg(x,y-28,6,.6);}}
    wall(W/2,900,16,200,0,true);spinner(150,900,4,95,.05,'#ff7a1a');spinner(450,900,4,95,-.05,'#ff7a1a');
    for(let i=0;i<5;i++){paddle(1080+i*120,220,170,.0011+i*.00025,i*1.3);}
    for(let r=0;r<5;r++){const y=1140+r*120;for(let c=0;c<4;c++){const x=75+c*150+(r%2)*75;peg(x,y,7,.7);}}
    for(let c=0;c<7;c++)peg(60+c*80,1690,6,.6);
  }

  /* ── section 4 (1420–1700): funnel into the rotating gate ring, with pop bumpers on the funnel walls ── */
  wall(RING.x-220,1729,320,20,.5,true);
  wall(RING.x+220,1729,320,20,-.5,true);
  [[165,1776],[W-165,1776]].forEach(([x,y])=>{
    const b=Bodies.circle(x,y,36,{isStatic:true,restitution:1,label:'pop'});b.plugin={kind:'pop',color:'#ff2d95',flash:0};obstacles.push(b);Composite.add(world,b);});
  wall(RING.x-RING.r-16,RING.y-45,16,120,0,true);
  wall(RING.x+RING.r+16,RING.y-45,16,120,0,true);
  const N=18,parts=[];
  for(let i=0;i<N;i++){const a=i*2*Math.PI/N;let d=Math.abs(((a+Math.PI/2+Math.PI)%(2*Math.PI))-Math.PI);
    if(d<RING.gapHalf)continue;
    parts.push(Bodies.rectangle(RING.x+Math.cos(a)*RING.r,RING.y+Math.sin(a)*RING.r,2*Math.PI*RING.r/N+3,12,{angle:a+Math.PI/2}));}
  ring=Body.create({parts,isStatic:true,label:'ring'});Body.setPosition(ring,{x:RING.x,y:RING.y});
  ring.plugin={kind:'ring',color:'#ffd400',flash:0};obstacles.push(ring);Composite.add(world,ring);
  wall(RING.x-RING.r-40,1988,22,140,0,true);wall(RING.x+RING.r+40,1988,22,140,0,true);
}

function build(){
  engine=Engine.create({gravity:{x:0,y:1.15}});engine.positionIterations=8;engine.velocityIterations=6;
  world=engine.world;balls=[];finished=[];particles=[];shocks=[];texts=[];winnerDone=false;timeScale=1;setTense(false);
  riders=[];riderWarn=null;nextRiderAt=performance.now()+4000;stopEngineSound();sabak=null;nextSabakAt=performance.now()+9000;shake={x:0,y:0};stopRumble();if(typeof killDaldal==='function')killDaldal();
  cam={y:0,x:0,zoom:1};
  buildMap();
  const list=parseNames();
  list.forEach((p,i)=>{
    const b=Bodies.circle(40+Math.random()*(W-80),26+Math.random()*70,R,{restitution:.5,friction:.03,frictionAir:.003,density:.002,label:'ball',collisionFilter:{category:2,mask:0xFFFF}});
    b.plugin={name:p.name,color:p.color,trail:[],idx:i,still:0};balls.push(b);Composite.add(world,b);
  });
  Events.on(engine,'collisionStart',onHit);
  $('count').textContent=balls.length;
  renderResults();setState('ready');$('winner').hidden=true;
  buildPrerender();
}

function onHit(e){
  e.pairs.forEach(pr=>{
    const a=pr.bodyA,b=pr.bodyB;let ball,other;
    if(a.label==='ball'&&b.label!=='ball'){ball=a;other=b;}else if(b.label==='ball'&&a.label!=='ball'){ball=b;other=a;}else return;
    const tgt=other.parent&&other.parent!==other?other.parent:other;
    if(!tgt.plugin||!tgt.plugin.kind)return;
    const sp=pr.collision.supports[0]||ball.position;
    const spd=Vector.magnitude(ball.velocity);
    tgt.plugin.flash=1;
    const n=tgt.plugin.kind==='bumper'?10:tgt.plugin.kind==='spinner'?8:tgt.plugin.kind==='ring'?6:4;
    if(tgt.plugin.kind!=='wall'||spd>4)burst(sp.x,sp.y,n,tgt.plugin.color,spd*.6);
    if(tgt.plugin.kind==='bumper'){const d=Vector.normalise(Vector.sub(ball.position,tgt.position));Body.applyForce(ball,ball.position,Vector.mult(d,.012));}
    if(tgt.plugin.kind==='rider'){
      const rr=riders.find(r=>r.body===tgt);const d=rr?rr.dir:1;
      Body.setVelocity(ball,{x:d*(7+Math.random()*8),y:-(7+Math.random()*9)});
      for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*8;particles.push({x:sp.x,y:sp.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:1,dur:650,g:.2,color:i%3===0?'#fff':ball.plugin.color,size:2+Math.random()*3});}
      shocks.push({x:sp.x,y:sp.y,r:4,v:9,life:1,color:'#ffd400',w:5});
      texts.push({x:sp.x,y:sp.y-26,text:'쾅!',sub:'',color:'#fff',life:.7});
      beep(140,.2,'square',.2);
      return;
    }
    if(tgt.plugin.kind==='pop'){
      const dir=ball.position.x<W/2?1:-1;
      Body.setVelocity(ball,{x:dir*(3+Math.random()*4),y:-(15+Math.random()*4)});
      for(let i=0;i<45;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=4+Math.random()*10;
        particles.push({x:sp.x,y:sp.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dur:700,g:.2,color:i%3===0?'#fff':i%3===1?'#ff2d95':ball.plugin.color,size:2+Math.random()*3});}
      shocks.push({x:sp.x,y:sp.y,r:4,v:8,life:1,color:'#ff2d95',w:6});shocks.push({x:sp.x,y:sp.y,r:0,v:12,life:1,color:'#fff',w:2});
      texts.push({x:sp.x,y:sp.y-30,text:'POP!',sub:'',color:'#ff2d95',life:.8});
      playPop();
    }
    if(tgt.plugin.kind!=='wall'||spd>5)playTick(tgt.plugin.kind,spd);
  });
}

/* ---------- state ---------- */
function setState(s){state=s;$('state').textContent={ready:'준비',shuffle:'섞는 중',running:'진행 중',paused:'일시정지',done:'종료'}[s];
  const st=$('start');st.textContent=s==='running'?'멈춤':s==='paused'?'계속':'시작';st.classList.toggle('stop',s==='running');}
function setTense(on){if(tense===on)return;tense=on;$('tense').classList.toggle('on',on);if(typeof applyBgmVol==='function')applyBgmVol();}
function targetRank(){const m=$('rankMode').value;const t=balls.length+finished.length;if(m==='first')return 1;if(m==='last')return t;return Math.min(t,Math.max(1,+$('rankN').value||1));}

function tick(dt){
  if(state==='shuffle'){
    balls.forEach(b=>Body.applyForce(b,b.position,{x:(Math.random()-.5)*.006,y:-Math.random()*.004}));
    if(performance.now()>shuffleUntil)setState('ready');
  }
  // decisive-moment detection: the ball that would decide the draw is in the ring zone
  let decisive=false;
  if(state==='running'&&!winnerDone&&$('slowmo').checked){
    const need=targetRank()-finished.length;
    const inZone=balls.filter(b=>b.position.y>RING.y-RING.r-90).length;
    decisive=need===1&&inZone>0;
  }
  setTense(decisive);
  const tsTarget=decisive?.38:1;timeScale+=(tsTarget-timeScale)*.12;
  const sdt=dt*timeScale;

  if(state!=='paused'){
    spinners.forEach(s=>Body.setAngle(s,s.angle+s.plugin.spd*timeScale));
    if(ring)Body.setAngle(ring,ring.angle+RING.spd*timeScale);
    movers.forEach(m=>{const p=m.plugin;p.phase+=p.spd*dt*timeScale;const nx=W/2+Math.sin(p.phase)*p.amp;Body.setVelocity(m,{x:nx-m.position.x,y:0});Body.setPosition(m,{x:nx,y:m.position.y});});Engine.update(engine,sdt/2);Engine.update(engine,sdt/2);}

  if(state==='running'){
    for(const b of balls.slice()){
      if(b.position.y>FINISH_Y){
        balls.splice(balls.indexOf(b),1);Composite.remove(world,b);finished.push(b.plugin);
        goalFirework(b.position.x,FINISH_Y-24,b.plugin);playGoal();
        renderResults();
        if(!winnerDone&&finished.length===targetRank()){winnerDone=true;announce(b.plugin,finished.length);}
      }
      if(b.position.y>H+200||b.position.x<-100||b.position.x>W+100){Body.setPosition(b,{x:W/2,y:200});Body.setVelocity(b,{x:0,y:0});}
      // anti-jam: a ball that sits still too long gets a kick
      const sp=Vector.magnitude(b.velocity);
      if(sp<.35&&b.position.y>GATE_Y+40){b.plugin.still+=dt;if(b.plugin.still>900){b.plugin.still=0;Body.applyForce(b,b.position,{x:(Math.random()-.5)*.02,y:-.012-Math.random()*.01});burst(b.position.x,b.position.y,5,'#fff',3);}}
      else b.plugin.still=0;
    }
    if(balls.length===0)setState('done');
  }
  balls.forEach(b=>{const t=b.plugin.trail;t.push({x:b.position.x,y:b.position.y});if(t.length>16)t.shift();});
  obstacles.forEach(o=>{if(o.plugin.flash>0)o.plugin.flash=Math.max(0,o.plugin.flash-dt/250);});
  particles=particles.filter(p=>{p.x+=p.vx*timeScale;p.y+=p.vy*timeScale;p.vy+=(p.g==null?.18:p.g)*timeScale;p.life-=dt/(p.dur||600);
    if(p.child&&p.life<.55&&!p.spawned){p.spawned=true;for(let i=0;i<7;i++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*3;particles.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,color:Math.random()<.4?'#fff':p.color,size:2+Math.random()*2,dur:500});}}
    return p.life>0;});
  shocks=shocks.filter(s=>{s.r+=s.v*timeScale;s.life-=dt/450;return s.life>0;});
  texts=texts.filter(t=>{t.y-=.9*timeScale;t.life-=dt/1100;return t.life>0;});
  // ambient embers rising from the goal mouth
  if(state!=='done'&&Math.random()<.7){const x=W/2+(Math.random()-.5)*110;particles.push({x,y:FINISH_Y+10,vx:(Math.random()-.5)*.6,vy:-1.2-Math.random()*1.8,g:-.02,life:1,dur:700,color:Math.random()<.5?'#ffd400':'#ff7a1a',size:1.5+Math.random()*2.5});}

  // camera: follow the leading pack, zoom into the ring on the decisive moment
  let ty=0,tx=0,tz=1;
  if(state==='running'||state==='paused'){
    const lead=balls.length?Math.max(...balls.map(b=>b.position.y)):H;
    ty=lead-VH*.58;
    if(decisive){tz=1.55;const vh=VH/tz,vw=W/tz;ty=RING.y+10-vh*.62;tx=W/2-vw/2;}
  }else if(state==='done'){ty=H-VH;}
  const vh=VH/tz,vw=W/tz;ty=Math.max(0,Math.min(H-vh,ty));tx=Math.max(0,Math.min(W-vw,tx));
  const k=decisive?.07:.09;cam.y+=(ty-cam.y)*k;cam.x+=(tx-cam.x)*k;cam.zoom+=(tz-cam.zoom)*.08;

  updateRider(dt,decisive);updateSabak(dt,decisive);
  if(decisive&&performance.now()-heartAt>820){heartAt=performance.now();beep(60,.25,'sine',.25);setTimeout(()=>beep(55,.2,'sine',.18),180);}
}

/* ---------- 썩박궤: character rises, fist covers the board, earthquake + sandstorm scrambles every ball ---------- */
const SABAK={inMs:500,holdMs:1700,outMs:600};
function updateSabak(dt,decisive){
  const now=performance.now();
  if(state!=='running'||!$('sabakOn').checked){if(sabak){sabak=null;shake={x:0,y:0};stopRumble();}return;}
  if(!sabak&&!riders.length&&!riderWarn&&!decisive&&now>nextSabakAt&&balls.length>1){
    sabak={t:0,kick:0,gust:0,slam:false};startRumble();beep(70,.6,'sawtooth',.25);

  if(hold){
    sabak.kick+=dt;sabak.gust+=dt;

      balls.forEach(b=>Body.applyForce(b,b.position,{x:(Math.random()-.5)*.016,y:-(Math.random()*.014)}));

      for(let i=0;i<40;i++)particles.push({x:cam.x+(dir>0?-20:vw+20),y:gy+(Math.random()-.5)*160,vx:dir*(10+Math.random()*14),vy:(Math.random()-.5)*2,g:.02,life:1,dur:500,color:Math.random()<.5?'#e8c88a':'#ffd9a0',size:1.5+Math.random()*3});
      balls.forEach(b=>{if(Math.abs(b.position.y-gy)<120)Body.applyForce(b,b.position,{x:dir*.02,y:0});});}

  if(p>.35){const pop=Math.min(1,(T-SABAK.inMs*.35)/220);const k=(0.4+0.6*(1-Math.pow(1-pop,3)))*(1+.09*Math.sin(T/38));
    c.save();c.translate(W/2,VH-84);c.scale(k,k);
    const txt='썩박궤'+(Math.floor(T/120)%2?'!!':'!');
    c.font='400 88px "Jua","Black Han Sans",sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.lineJoin='round';c.lineWidth=18;c.strokeStyle='#3a0a24';c.strokeText(txt,0,0);
    c.lineWidth=7;c.strokeStyle='#fff';c.strokeText(txt,0,0);
    c.fillStyle='#ffb3d9';c.shadowBlur=30;c.shadowColor='#ff8fcf';c.fillText(txt,0,0);c.restore();}

let rumble=null;

  const o=audio.createOscillator(),g=audio.createGain(),lfo=audio.createOscillator(),lg=audio.createGain();
  o.type='sawtooth';o.frequency.value=38;lfo.type='sine';lfo.frequency.value=7;lg.gain.value=14;lfo.connect(lg).connect(o.frequency);
  const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=180;

}
function stopRumble(){if(!rumble)return;const r=rumble;rumble=null;try{r.g.gain.setTargetAtTime(.0001,audio.currentTime,.12);r.o.stop(audio.currentTime+.6);r.lfo.stop(audio.currentTime+.6);}catch(e){}}

/* ---------- drawing ---------- */
function buildPrerender(){
  if(!canvas.width)return;
  const s=canvas.width/W;
  prerender=document.createElement('canvas');prerender.width=Math.round(W*s);prerender.height=Math.round(H*s);
  const c=prerender.getContext('2d');c.scale(s,s);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0e3a');g.addColorStop(.5,'#070a2c');g.addColorStop(1,'#1a0520');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(0,240,255,.06)';c.lineWidth=1;
  for(let x=0;x<=W;x+=50){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  for(let y=0;y<=H;y+=50){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  c.fillStyle='rgba(255,212,0,.05)';c.fillRect(0,0,W,GATE_Y);
  c.strokeStyle='rgba(255,212,0,.35)';c.setLineDash([10,8]);c.beginPath();c.moveTo(0,GATE_Y);c.lineTo(W,GATE_Y);c.stroke();c.setLineDash([]);
  // goal
  const gg=c.createLinearGradient(0,FINISH_Y-30,0,H);gg.addColorStop(0,'rgba(255,212,0,0)');gg.addColorStop(1,'rgba(255,212,0,.6)');
  c.fillStyle=gg;c.fillRect(RING.x-RING.r-28,FINISH_Y-30,(RING.r+28)*2,H-FINISH_Y+30);
  c.fillStyle='#ffd400';c.font='400 22px "Black Han Sans"';c.textAlign='center';c.fillText('GOAL',W/2,FINISH_Y+30);
  obstacles.forEach(o=>{if(o.plugin.kind==='spinner'||o.plugin.kind==='ring'||o.plugin.kind==='paddle')return;drawObstacle(c,o,0);});
}
function drawObstacle(c,o,flash){
  const k=o.plugin.kind,col=o.plugin.color;
  c.save();
  if(flash>0){c.shadowBlur=30*flash;c.shadowColor='#fff';}else{c.shadowBlur=10;c.shadowColor=col;}
  if(k==='peg'){c.fillStyle=flash>0?'#fff':col;c.beginPath();c.arc(o.position.x,o.position.y,o.circleRadius+flash*3,0,Math.PI*2);c.fill();}
  else if(k==='pop'){
    const r=o.circleRadius;c.shadowBlur=flash>0?40:22;c.shadowColor=flash>0?'#fff':col;
    const rg=c.createRadialGradient(o.position.x,o.position.y-r*.3,2,o.position.x,o.position.y,r);
    rg.addColorStop(0,'#fff');rg.addColorStop(.35,flash>0?'#fff':col);rg.addColorStop(1,flash>0?col:'rgba(120,0,60,.9)');
    c.fillStyle=rg;c.beginPath();c.arc(o.position.x,o.position.y,r+flash*6,0,Math.PI*2);c.fill();
    c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
    c.fillStyle=flash>0?col:'#fff';c.font='400 16px "Black Han Sans"';c.textAlign='center';c.textBaseline='middle';c.fillText('POP',o.position.x,o.position.y+1);
  }else if(k==='bumper'){
    const r=o.circleRadius;const rg=c.createRadialGradient(o.position.x-r*.3,o.position.y-r*.3,2,o.position.x,o.position.y,r);
    rg.addColorStop(0,'#fff');rg.addColorStop(.3,col);rg.addColorStop(1,'rgba(0,0,0,.6)');
    c.fillStyle=rg;c.beginPath();c.arc(o.position.x,o.position.y,r+flash*4,0,Math.PI*2);c.fill();
    c.strokeStyle=flash>0?'#fff':col;c.lineWidth=3;c.stroke();
  }else if(k==='paddle'){
    const v=o.vertices;c.beginPath();c.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)c.lineTo(v[i].x,v[i].y);c.closePath();
    c.fillStyle=flash>0?'#fff':col;c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();
    c.fillStyle='rgba(0,0,0,.5)';for(let i=-2;i<=2;i++){c.beginPath();c.arc(o.position.x+i*30,o.position.y,3,0,Math.PI*2);c.fill();}
  }else if(k==='ramp'||k==='wall'){
    const v=o.vertices;c.beginPath();c.moveTo(v[0].x,v[0].y);for(let i=1;i<v.length;i++)c.lineTo(v[i].x,v[i].y);c.closePath();
    c.fillStyle=flash>0?'#fff':(k==='wall'?'#1b3f8a':col);c.fill();c.strokeStyle=flash>0?'#fff':col;c.lineWidth=2.5;c.stroke();
  }
  c.restore();
}
function drawSpinner(c,s){
  const p=s.plugin;c.save();c.translate(s.position.x,s.position.y);c.rotate(s.angle);
  c.shadowBlur=18+p.flash*25;c.shadowColor=p.flash>0?'#fff':p.color;c.strokeStyle=p.flash>0?'#fff':p.color;c.lineWidth=12;c.lineCap='round';
  for(let i=0;i<p.arms;i++){const a=Math.PI*i/p.arms;c.beginPath();c.moveTo(-Math.cos(a)*p.len,-Math.sin(a)*p.len);c.lineTo(Math.cos(a)*p.len,Math.sin(a)*p.len);c.stroke();}
  c.fillStyle='#fff';c.beginPath();c.arc(0,0,11,0,Math.PI*2);c.fill();c.restore();
}
function drawRing(c){
  const p=ring.plugin;c.save();c.translate(ring.position.x,ring.position.y);c.rotate(ring.angle);
  c.shadowBlur=22+p.flash*25;c.shadowColor=p.flash>0?'#fff':p.color;c.strokeStyle=p.flash>0?'#fff':p.color;c.lineWidth=12;c.lineCap='round';
  c.beginPath();c.arc(0,0,RING.r,-Math.PI/2+RING.gapHalf,-Math.PI/2-RING.gapHalf+Math.PI*2);c.stroke();
  // gap marker
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.setLineDash([4,6]);c.beginPath();c.arc(0,0,RING.r,-Math.PI/2-RING.gapHalf,-Math.PI/2+RING.gapHalf);c.stroke();
  c.restore();
}
function draw(){
  if(!prerender)return;
  const s=canvas.width/W,z=cam.zoom;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#04051a';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(1,0,0,1,0,0);
  if(shake.rot||shake.zoom){ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(shake.rot||0);const zz=1+(shake.zoom||0);ctx.scale(zz,zz);ctx.translate(-canvas.width/2,-canvas.height/2);}
  ctx.transform(s*z,0,0,s*z,(-cam.x*z+shake.x)*s,(-cam.y*z+shake.y)*s);
  ctx.drawImage(prerender,0,0,W,H);
  obstacles.forEach(o=>{if(o.plugin.kind==='paddle')drawObstacle(ctx,o,o.plugin.flash);else if(o.plugin.kind!=='spinner'&&o.plugin.kind!=='ring'&&o.plugin.flash>0)drawObstacle(ctx,o,o.plugin.flash);});
  spinners.forEach(sp=>drawSpinner(ctx,sp));
  if(ring)drawRing(ctx);
  balls.forEach(b=>{const t=b.plugin.trail;if(t.length<2)return;ctx.lineCap='round';
    for(let i=1;i<t.length;i++){const a=i/t.length;ctx.strokeStyle=b.plugin.color;ctx.globalAlpha=a*.45;ctx.lineWidth=R*2*a*.9;
      ctx.beginPath();ctx.moveTo(t[i-1].x,t[i-1].y);ctx.lineTo(t[i].x,t[i].y);ctx.stroke();}
    ctx.globalAlpha=1;});
  let leader=null;if(state==='running'&&balls.length>1){leader=balls.reduce((m,b)=>b.position.y>m.position.y?b:m,balls[0]);}
  ctx.font='700 12px "Noto Sans KR"';ctx.textAlign='center';ctx.textBaseline='middle';
  balls.forEach(b=>{const {x,y}=b.position,col=b.plugin.color;
    ctx.save();ctx.shadowBlur=16;ctx.shadowColor=col;
    const rg=ctx.createRadialGradient(x-4,y-4,1,x,y,R);rg.addColorStop(0,'#fff');rg.addColorStop(.35,col);rg.addColorStop(1,'rgba(0,0,0,.55)');
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(b.plugin.name,x,y-R-9);ctx.fillStyle='#fff';ctx.fillText(b.plugin.name,x,y-R-9);
  });
  if(leader){const {x,y}=leader.position;ctx.save();ctx.translate(x,y+R+14);ctx.fillStyle='#ffd400';ctx.shadowBlur=12;ctx.shadowColor='#ffd400';
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,2);ctx.lineTo(-7,2);ctx.closePath();ctx.fill();ctx.font='400 11px "Black Han Sans"';ctx.textBaseline='top';ctx.fillText('선두',0,4);ctx.restore();}
  drawRider(ctx);
  // goal mouth glow, pulsing
  {const pu=.6+.4*Math.sin(performance.now()/160);const gg=ctx.createRadialGradient(W/2,FINISH_Y+10,4,W/2,FINISH_Y+10,120);
    gg.addColorStop(0,`rgba(255,212,0,${.45*pu})`);gg.addColorStop(.5,`rgba(255,80,20,${.18*pu})`);gg.addColorStop(1,'rgba(255,80,20,0)');
    ctx.fillStyle=gg;ctx.fillRect(W/2-120,FINISH_Y-110,240,160);}
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();});
  shocks.forEach(sh=>{ctx.globalAlpha=sh.life;ctx.strokeStyle=sh.color;ctx.lineWidth=sh.w*sh.life;ctx.shadowBlur=20;ctx.shadowColor=sh.color;ctx.beginPath();ctx.arc(sh.x,sh.y,sh.r,0,Math.PI*2);ctx.stroke();});
  ctx.shadowBlur=0;
  texts.forEach(tx=>{ctx.globalAlpha=Math.min(1,tx.life*1.5);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='400 44px "Black Han Sans"';ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.strokeText(tx.text,tx.x,tx.y);ctx.fillStyle='#ffd400';ctx.fillText(tx.text,tx.x,tx.y);
    ctx.font='900 18px "Noto Sans KR"';ctx.lineWidth=4;ctx.strokeText(tx.sub,tx.x,tx.y+34);ctx.fillStyle=tx.color;ctx.fillText(tx.sub,tx.x,tx.y+34);});
  ctx.globalAlpha=1;

  drawSabak(ctx,s);
  // screen-space overlay: marquee bulbs + track minimap
  ctx.setTransform(s,0,0,s,0,0);
  const t=performance.now()/120;ctx.fillStyle='#ffd400';
  for(let i=0;i<40;i++){const on=((i+Math.floor(t))%3)===0;ctx.globalAlpha=on?1:.18;const y=14+i*25;if(y>VH-14)break;
    ctx.beginPath();ctx.arc(10,y,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(W-10,y,4,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  const mx=W-34,my=40,mh=VH-80,mw=12;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.strokeStyle='rgba(0,240,255,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(mx,my,mw,mh,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(0,240,255,.25)';ctx.fillRect(mx,my+cam.y/H*mh,mw,(VH/cam.zoom)/H*mh);
  ctx.fillStyle='#ffd400';ctx.fillRect(mx-2,my+FINISH_Y/H*mh,mw+4,2);
  balls.forEach(b=>{ctx.fillStyle=b.plugin.color;ctx.beginPath();ctx.arc(mx+mw/2,my+b.position.y/H*mh,3,0,Math.PI*2);ctx.fill();});
}
function goalFirework(x,y,p){
  const col=p.color;
  for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*11;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,life:1,dur:950,g:.12,color:i%4===0?'#fff':i%4===1?'#ffd400':col,size:2.5+Math.random()*3.5,child:i%6===0});}
  for(let i=0;i<30;i++){const a=-Math.PI/2+(Math.random()-.5)*1.1,v=9+Math.random()*9;   // fountain upward
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dur:1300,g:.22,color:Math.random()<.5?'#ffd400':'#ff7a1a',size:2+Math.random()*3});}
  shocks.push({x,y,r:6,v:9,life:1,color:'#fff',w:7});shocks.push({x,y,r:2,v:6,life:1,color:col,w:4});shocks.push({x,y,r:0,v:13,life:1,color:'#ffd400',w:2});
  texts.push({x,y:y-40,text:'GOAL!',sub:p.name,color:col,life:1});
  const cab=$('cabinet');cab.classList.remove('shake');void cab.offsetWidth;cab.classList.add('shake');
}
function burst(x,y,n,color,power){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*(2+power*.3);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,color:Math.random()<.3?'#fff':color,size:2+Math.random()*3});}
  if(particles.length>600)particles.splice(0,particles.length-600);
}

/* ---------- winner ---------- */
function announce(p,rank){
  setTense(false);
  $('winName').textContent=p.name;$('winName').style.color=p.color;$('winMeta').textContent=rank+'번째 골인';
  $('winner').hidden=false;
  $('cabinet').classList.remove('shake');void $('cabinet').offsetWidth;$('cabinet').classList.add('shake');
  $('flash').classList.remove('on');void $('flash').offsetWidth;$('flash').classList.add('on');
  for(let i=0;i<220;i++)confetti.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*18,vy:-8-Math.random()*14,rot:Math.random()*6,vr:(Math.random()-.5)*.4,
    color:PALETTE[i%PALETTE.length],w:6+Math.random()*8,h:4+Math.random()*6,life:1});
  playFanfare();renderResults();
}
function drawConfetti(dt){
  fctx.setTransform(dpr,0,0,dpr,0,0);fctx.clearRect(0,0,innerWidth,innerHeight);
  if(!confetti.length)return;
  confetti=confetti.filter(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.35;c.vx*=.985;c.rot+=c.vr;c.life-=dt/3200;return c.life>0&&c.y<innerHeight+40;});
  confetti.forEach(c=>{fctx.save();fctx.translate(c.x,c.y);fctx.rotate(c.rot);fctx.globalAlpha=Math.min(1,c.life*2);fctx.fillStyle=c.color;fctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);fctx.restore();});
}
function renderResults(){
  const ol=$('results');const tr=finished.length||balls.length?targetRank():0;
  if(!finished.length){ol.innerHTML='<li class="empty">골인 없음</li>';return;}
  ol.innerHTML=finished.map((p,i)=>`<li class="${i+1===tr?'win':''}"><span class="rank">${i+1}</span><span class="dot" style="color:${p.color};background:${p.color}"></span><span>${esc(p.name)}</span>${i+1===tr?'<span style="margin-left:auto;color:var(--gold);font-weight:900">당첨</span>':''}</li>`).join('');
  if(state==='running')ol.scrollTop=ol.scrollHeight;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- sound ---------- */
function ensureAudio(){if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(e){audio=null;}}if(audio&&audio.state==='suspended')audio.resume();}
function beep(freq,dur,type,gain){if(!audio||!$('sound').checked)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}
function playTick(kind,spd){const now=performance.now();if(now-lastTick<35)return;lastTick=now;
  const pitch=timeScale<.8?.55:1;
  if(kind==='bumper')beep((220+Math.random()*60)*pitch,.18,'square',.08);
  else if(kind==='spinner')beep(520*pitch,.12,'sawtooth',.06);
  else if(kind==='ring')beep(330*pitch,.15,'triangle',.09);
  else beep((1400+Math.min(spd,20)*40)*pitch,.06,'square',.04);}
function playPop(){beep(90,.22,'sine',.3);beep(1800,.1,'square',.08);setTimeout(()=>beep(2400,.12,'square',.06),40);}
function playGoal(){beep(880,.25,'triangle',.12);setTimeout(()=>beep(1320,.3,'triangle',.1),90);}
function playFanfare(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,.5,'triangle',.14),i*110));}

/* ---------- BGM ---------- */
const bgm=$('bgm');let bgmWanted=false;

try{const v=localStorage.getItem('pinball-bgm-vol');if(v!=null){$('bgmVol').value=v;}}catch(e){}
function bgmBase(){return (+$('bgmVol').value||0)/100;}
function applyBgmVol(){const v=bgmBase();$('bgmVolLabel').textContent=Math.round(v*100)+'%';
  bgm.volume=Math.max(0,Math.min(1,v*(tense?.45:1)));
  try{bgm.preservesPitch=false;bgm.mozPreservesPitch=false;}catch(e){}
  bgm.playbackRate=tense?.72:1;}
function bgmPlay(){bgmWanted=true;applyBgmVol();bgm.play().then(()=>{$('bgmToggle').textContent='일시정지';}).catch(()=>{$('bgmToggle').textContent='재생';});}
function bgmPause(keepWanted){if(!keepWanted)bgmWanted=false;bgm.pause();$('bgmToggle').textContent='재생';}
$('bgmVol').addEventListener('input',()=>{applyBgmVol();try{localStorage.setItem('pinball-bgm-vol',$('bgmVol').value);}catch(e){}});
$('bgmToggle').onclick=()=>{bgm.paused?bgmPlay():bgmPause();};
applyBgmVol();

/* ---------- controls ---------- */
$('shuffle').onclick=()=>{ensureAudio();if(bgm.paused)bgmPlay();if(state==='running'||state==='paused'||state==='done')build();shuffleUntil=performance.now()+1400;setState('shuffle');};
$('start').onclick=()=>{ensureAudio();
  if(state==='running'){setState('paused');bgmPause(true);killDaldal();return;}
  if(state==='paused'){setState('running');if(bgmWanted)bgmPlay();return;}
  if(bgm.paused)bgmPlay();
  if(state==='done')build();
  if(!balls.length){build();if(!balls.length)return;}
  Composite.remove(world,gate);setState('running');};
$('reset').onclick=()=>build();
$('again').onclick=()=>{build();$('shuffle').click();};
$('fillRange').onclick=()=>{const n=Math.max(2,Math.min(300,+$('rangeN').value||20));$('names').value=Array.from({length:n},(_,i)=>i+1).join(', ');build();};
$('names').addEventListener('change',()=>{if(state==='ready')build();});
$('rankMode').addEventListener('change',renderResults);$('rankN').addEventListener('change',renderResults);
document.querySelectorAll('.map').forEach(b=>b.onclick=()=>{document.querySelectorAll('.map').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');map=b.dataset.map;build();});
$('fs').onclick=()=>{const el=$('cabinet');if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}else if(el.requestFullscreen){el.requestFullscreen().then(resize).catch(()=>{});}};
document.addEventListener('fullscreenchange',()=>setTimeout(resize,50));

/* ---------- loop ---------- */
function loop(now){
  const dt=Math.min(32,now-(last||now));last=now;
  tick(dt);draw();drawConfetti(dt);
  requestAnimationFrame(loop);
}
resize();build();requestAnimationFrame(loop);
})();
</script>
