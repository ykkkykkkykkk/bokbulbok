<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감컴좀비런</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
</head>
<body>
<style>
/* Layout: control panel left, pseudo-3D street chase right (perspective projection, painter's order). Warm late-afternoon anime palette; the horde is the only sickly green. */
:root{
  --bg:#1a1410;
  --panel:#2a211a;
  --line:#4a3a2c;
  --fg:#fff4e6;
  --muted:#b89f86;
  --sun:#ffb347;
  --red:#ff3b30;
  --zomb:#7ed957;
  --font-display:"Black Han Sans","Noto Sans KR",sans-serif;
  --font-body:"Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);min-height:100%;
  background-image:radial-gradient(ellipse at 80% 0%,rgba(255,179,71,.18),transparent 55%),radial-gradient(ellipse at 10% 100%,rgba(126,217,87,.10),transparent 50%)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;max-width:1180px;margin:0 auto;
  padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:820px){.app{grid-template-columns:1fr}}
h1{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1;margin:0;color:#fff;text-shadow:3px 3px 0 #2a7a1a,0 0 18px rgba(126,217,87,.6)}
.sub{color:var(--muted);font-size:12px;margin:6px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;align-self:start}
label.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}
textarea,input[type=number],select{width:100%;box-sizing:border-box;background:#17110d;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.5 var(--font-body)}
textarea{min-height:90px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.btn{border:0;border-radius:12px;padding:13px 16px;font:900 15px var(--font-body);cursor:pointer;color:#1a1410;flex:1;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.start{background:var(--zomb);box-shadow:0 0 18px rgba(126,217,87,.4)}
.btn.start.stop{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,59,48,.5)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);flex:0 0 auto;padding:13px 14px}
.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:#17110d;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.status b{color:var(--sun);font-family:var(--font-display);font-weight:400;font-size:18px}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto;font-variant-numeric:tabular-nums}
.results li{display:flex;align-items:center;gap:10px;background:#17110d;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px}
.results .rank{font-family:var(--font-display);width:52px;color:var(--muted);font-size:13px}
.results .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:0 0 auto}
.results li.win{border-color:var(--sun);box-shadow:0 0 14px rgba(255,179,71,.35)}
.results li.win .rank{color:var(--sun)}
.results .empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);justify-content:center}
.stage{position:relative;min-width:0}
.screen{position:relative;margin:0 auto;width:min(100%,640px);aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;
  background:#3a2a20;border:3px solid #5a4030;box-shadow:0 0 0 6px #1f1711,0 0 50px rgba(255,179,71,.18),0 0 90px rgba(126,217,87,.14)}
.screen.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
canvas#board{display:block;width:100%;height:100%}
.flash{position:absolute;inset:0;background:#ff3b30;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.6}100%{opacity:0}}
.winner{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,14,10,.78);backdrop-filter:blur(3px)}
.winner[hidden]{display:none}
.winner .card{text-align:center;padding:28px 34px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.winner .eyebrow{font-family:var(--font-display);font-size:20px;color:var(--sun);letter-spacing:.2em;text-shadow:0 0 18px rgba(255,179,71,.8)}
.winner .name{font-family:var(--font-display);font-size:clamp(46px,12vw,84px);line-height:1.05;margin:8px 0;text-shadow:0 0 30px currentColor;word-break:keep-all}
.winner .meta{color:#fff;font-weight:700;font-size:15px}
.winner button{margin-top:18px;background:var(--sun)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.screen.shake{animation:none}.winner .card{animation:none}}
</style>

<div class="app">
  <aside class="panel">
    <div><h1>감컴좀비런</h1><p class="sub">감컴 5인 중 끝까지 안 잡히는 한 명은 누구?</p></div>
    <div>
      <label class="lbl">출전 멤버</label>
      <div class="row" id="roster"></div>
    </div>
    <div>
      <label class="lbl" for="guess">누가 살아남을까</label>
      <select id="guess"><option value="">예측 안 함</option></select>
      <p class="hint">시청자 예측을 골라두면 결과에서 적중 여부를 보여줘요</p>
    </div>
    <div class="row">
      <div style="flex:1">
        <label class="lbl" for="rankMode">당첨</label>
        <select id="rankMode">
          <option value="last">최후의 생존자</option>
          <option value="first">첫 번째 감염자</option>
          <option value="n">N번째 감염자</option>
        </select>
      </div>
      <div style="width:84px"><label class="lbl" for="rankN">N</label><input type="number" id="rankN" value="3" min="1"></div>
    </div>
    <div class="row">
      <button class="btn start" id="start" type="button">도망쳐</button>
      <button class="btn ghost" id="reset" type="button">초기화</button>
    </div>
    <div>
      <label class="lbl">길 위의 변수</label>
      <div class="row">
        <label class="chip"><input type="checkbox" id="evTrip" checked> 넘어짐</label>
        <label class="chip"><input type="checkbox" id="evPush" checked> 밀치기</label>
        <label class="chip"><input type="checkbox" id="evObs" checked> 장애물</label>
        <label class="chip"><input type="checkbox" id="evSprint" checked> 전력질주</label>
      </div>
    </div>
    <div class="row">
      <label class="chip"><input type="checkbox" id="sound" checked> 효과음</label>
      <label class="chip">BGM <input type="range" id="bgmVol" min="0" max="100" value="38" style="width:78px;vertical-align:middle"></label>
      <audio id="bgm" src="assets/zombie_bgm2.mp3" loop preload="auto"></audio>
      <label class="chip"><input type="checkbox" id="slowmo" checked> 슬로모션</label>
      <button class="btn ghost" id="fs" type="button" style="padding:6px 10px;font-size:12px">전체화면</button>
    </div>
    <div class="status"><span>상태 <b id="state">대기</b></span><span>생존 <b id="count">0</b></span></div>
    <div>
      <label class="lbl">감염 순서</label>
      <ol class="results" id="results"><li class="empty">아직 전원 생존</li></ol>
    </div>
  </aside>
  <main class="stage">
    <div class="screen" id="screen">
      <canvas id="board"></canvas>
      <div class="flash" id="flash"></div>
      <div class="winner" id="winner" hidden>
        <div class="card">
          <div class="eyebrow" id="winEyebrow">생존자</div>
          <div class="name" id="winName"></div>
          <div class="meta" id="winMeta"></div>
          <button class="btn" id="again" type="button">다시 도망</button>
        </div>
      </div>
    </div>
  </main>
</div>
<canvas id="fx"></canvas>

<script>
(function(){
const PALETTE=['#ff5fa2','#5df2ff','#ffd400','#ff7a1a','#b388ff','#3dffc5','#ff4d4d','#7cc4ff','#ffe08a','#c8ff8a','#ffb3d9','#9affff','#ffc48a','#d1b3ff','#8cff3a','#ff9ad5'];
const BAL={hongPush:200,dbTrip:2000,dbBack:45,beardStun:1800,waveTrip:850,waveBack:40,capySit:1200,capyN:3,hongFly:1800}; // tuned by 5,000-round sim: each member ~20% survival
const ROSTER=[
  {name:'지피티',key:'gpt',color:'#5df2ff',hair:'#1a1410',skill:'지창덤벨'},
  {name:'박재박',key:'parkjaebak',color:'#ffd400',hair:'#2a1a12',skill:'털가시'},
  {name:'울산큰고래',key:'ulsan',color:'#8cff3a',hair:'#1a1410',skill:'고래웨이브'},
  {name:'조경훈',key:'jokyunghoon',color:'#ff7a1a',hair:'#1a1410',skill:'썩피바라'},
  {name:'홍타쿠',key:'hongtaku',color:'#b388ff',hair:'#2a1a12',skill:'홍창스윙'}];
const ROW={parkjaebak:0,gpt:1,ulsan:2,jokyunghoon:3,hongtaku:4};const CELL_W=240,CELL_H=660,FRAMES=8;
const SKIN=['#ffd9b3','#f5c6a0','#ffe0c2','#e8b990'];
const HAIR=['#3a2418','#111','#6b3b1e','#c75a1e','#222','#4a2a6b','#8a8a8a','#d4a017'];
const CAPTIONS=['건들지마!! 내버려둬!!','살려줘!!!','밀지마 이 자식아!!','내가 왜 뒤야!!','엄마아아아!!','먼저 가!! 아니 가지마!!','신발 벗겨졌어!!','뛰어!! 생각하지 말고 뛰어!!','야 너 물렸어?!','아 다리 풀려…','뒤돌아보지 마!!','숨 쉬는 법을 까먹었어!!'];
const $=id=>document.getElementById(id);
const canvas=$('board'),ctx=canvas.getContext('2d');
const fx=$('fx'),fctx=fx.getContext('2d');
let dpr=Math.min(window.devicePixelRatio||1,2);

/* ---------- pseudo-3D camera ----------
   World: d = distance run along the street (increases as they run toward the camera, which retreats ahead of them).
   x = lateral position (road half-width ROAD), h = height. Camera sits CAM_AHEAD in front of the lead runner, looking back.
   Screen: sx = CX + x*F/dz ; sy = HORIZON + (CAM_H-h)*F/dz ; scale = F/dz, dz = camD - d.                            */
const W=640,VH=480,CX=W/2,F=330,CAM_H=120,HORIZON=VH*.40,ROAD=150,SIDEWALK=95,CAM_AHEAD=330;
let runners=[],infected=[],obstacles=[],particles=[],confetti=[],texts=[];
let state='ready',winnerDone=false,last=0,timeScale=1,tense=false;
let horde={d:0,speed:0,mob:[]},camD=0,camX=0,shakeAmt=0,shk={x:0,y:0},impactT=0,grain=null,cutin=null,freezeT=0,skillSlow=0,swingFx=null,impactFx=[],skillObjs=[],lastSkillAt=0,viewZ=1,viewOX=0,viewOY=0,fovPunch=0,caption=null,nextCaptionAt=0,elapsed=0,audio=null;
const SPR=new Image();SPR.src='assets/gamcom5_run.png';const SPR_N=9,SPR_W=424,SPR_H=358;
const SPR_OFF=[-11.4,-10.0,-2.5,-3.5,-9.8,-9.2,-4.8,-4.6,-5.6]; // per-frame centroid drift, cancelled on draw
const proj=(x,d,h)=>{const dz=Math.max(8,camD-d);const sc=F/dz;return {sx:CX+(x-camX)*sc,sy:HORIZON+(CAM_H-(h||0))*sc,sc,dz};};

/* ---------- sizing ---------- */
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);fx.width=Math.round(innerWidth*dpr);fx.height=Math.round(innerHeight*dpr);}
addEventListener('resize',resize);
$('bgmVol').addEventListener('input',()=>{$('bgm').volume=(+$('bgmVol').value)/100;});

/* ---------- build ---------- */
function parseNames(){return ROSTER.map(r=>r.name);}
function build(){
  const names=parseNames();runners=[];infected=[];obstacles=[];particles=[];texts=[];winnerDone=false;timeScale=1;setTense(false);elapsed=0;caption=null;nextCaptionAt=1500;fovPunch=0;
  const n=Math.max(1,names.length);
  names.forEach((name,i)=>{
    const lane=(i+.5)/n;const R=ROSTER[i];
    runners.push({name,color:R.color,key:R.key,skin:SKIN[i%SKIN.length],hair:R.hair,i,
      x:-ROAD+40+(ROAD*2-80)*lane+(Math.random()-.5)*20,d:((i*5)%n)/n*170+Math.random()*25,vx:0,speed:0,base:2.35+Math.random()*.9,target:2.5,retarget:0,
      trip:0,sprint:0,stun:0,leg:Math.random()*10,alive:true,skillUsed:false,swing:0,fly:0,flyVz:0,flyH:0});
  });
  impactFx=[];skillObjs=[];lastSkillAt=0;
  horde={d:-380,speed:2.6,mob:[]};
  for(let i=0;i<8;i++){horde.mob.push({x:(-ROAD+30)+(ROAD*2-60)*((i+.5)/8)+(Math.random()-.5)*30,dd:-Math.random()*90,ph:Math.random()*6,s:1.05+Math.random()*.25,skin:['#8fcf6a','#79b85a','#a3d97a','#b5e28a'][i%4]});}
  camD=Math.max(...runners.map(r=>r.d))+CAM_AHEAD;camX=0;
  $('count').textContent=runners.length;renderResults();setState('ready');$('winner').hidden=true;
  spawnObstacles();
}
function spawnObstacles(){
  if(!$('evObs').checked)return;
  const lead=Math.max(...runners.filter(r=>r.alive).map(r=>r.d),0);
  while(!obstacles.length||Math.max(...obstacles.map(o=>o.d))<lead+1400){
    const d=(obstacles.length?Math.max(...obstacles.map(o=>o.d)):lead+300)+(220+Math.random()*260);
    const kinds=['manhole','bin','cart','banana'];const k=kinds[Math.floor(Math.random()*kinds.length)];
    obstacles.push({kind:k,x:(Math.random()-.5)*(ROAD*2-80),d,r:k==='cart'?36:k==='bin'?22:k==='manhole'?24:14,hit:0});
  }
  obstacles=obstacles.filter(o=>o.d>horde.d-300);
}

/* ---------- state ---------- */
function bgmSync(s){const a=$('bgm');if(!a)return;a.volume=(+$('bgmVol').value)/100;if(s==='running'){a.play().catch(()=>{});}else if(s==='paused'){a.pause();}else if(s==='ready'){a.pause();a.currentTime=0;}}
function setState(s){state=s;bgmSync(s);$('state').textContent={ready:'대기',running:'도주 중',paused:'일시정지',done:'종료'}[s];
  const b=$('start');b.textContent=s==='running'?'멈춤':s==='paused'?'계속':'도망쳐';b.classList.toggle('stop',s==='running');}
function setTense(on){tense=on;}
function targetRank(){const m=$('rankMode').value;const t=runners.length;if(m==='last')return t;if(m==='first')return 1;return Math.min(t,Math.max(1,+$('rankN').value||1));}

/* ---------- tick ---------- */
function tick(dt){
  const alive=runners.filter(r=>r.alive);
  let decisive=false;
  if(state==='running'&&!winnerDone&&$('slowmo').checked){const need=targetRank()-infected.length;const near=alive.filter(r=>r.d-horde.d<90).length;decisive=need===1&&near>0;}
  setTense(decisive);if(skillSlow>0)skillSlow-=dt;const tsWant=skillSlow>0?.4:(cutin&&cutin.t<cutin.slowUntil?.22:(decisive?.42:1));timeScale+=(tsWant-timeScale)*(skillSlow>0||cutin?.35:.12);
  if(cutin){cutin.t+=dt;if(cutin.t>cutin.dur)cutin=null;}
  if(freezeT>0){freezeT-=dt;return;}
  const f=dt/16.67*timeScale;

  if(state==='running'){
    elapsed+=dt*timeScale;
    horde.speed=2.6+elapsed/1000*.022+infected.length*.02;
    horde.d+=horde.speed*f;
    horde.mob.forEach(m=>{m.ph+=dt/170*timeScale;});

    for(const r of alive){
      r.retarget-=dt*timeScale;
      if(r.retarget<=0){r.retarget=600+Math.random()*900;r.target=r.base+(Math.random()-.5)*.8;
        if($('evSprint').checked&&Math.random()<.14&&!r.sprint){r.sprint=700+Math.random()*500;texts.push({r,text:'전력질주!',color:r.color,life:.9});}
        if($('evTrip').checked&&Math.random()<.08&&!r.trip){tripRunner(r,'꽈당');}
      }
      // knocked flying by a bat: arc backward through the air, then land stunned
      if(r.fly>0){r.fly-=dt*timeScale;r.d-=3*f;r.flyH+=r.flyVz*f;r.flyVz-=.4*f;if(Math.random()<.5)particles.push({x:r.x,d:r.d,h:r.flyH*3+60,vx:(Math.random()-.5)*2,vd:(Math.random()-.5)*2,vh:.5,life:1,dur:500,color:'#ffd400',size:5,star:true});if(r.flyH<=0){r.flyH=0;r.fly=0;r.trip=600;puff(r.x,r.d,16,'#c9b99a');beep(120,.2,'square',.2);}continue;}
      maybeSkill(r,dt);
      if(r.sk){const S=SKILLS[r.sk.type];r.sk.t+=dt;if(!r.sk.hit&&r.sk.t>=S.fire){r.sk.hit=true;S.onFire(r);}if(r.sk.t>S.end)r.sk=null;else r.speed*=.992;}
      if(r.prick>0)r.prick-=dt*timeScale;
      if(r.trip>0){r.trip-=dt*timeScale;continue;}
      if(r.stun>0)r.stun-=dt*timeScale;
      let tgt=r.target*(r.sprint>0?1.6:1)*(r.stun>0?.3:1);
      if(r.d-horde.d<160)tgt*=1.07;
      if(r.sprint>0)r.sprint-=dt*timeScale;
      r.speed+=(tgt-r.speed)*.06*f;
      r.d+=r.speed*f;r.leg+=r.speed*f*.35;r.anim=(r.anim||0)+r.speed*f*.055;
      if(Math.random()<.22*timeScale)particles.push({puff:true,x:r.x+(Math.random()-.5)*26,d:r.d-18,h:4,vx:(Math.random()-.5)*.8,vd:-1.2-Math.random()*1.2,vh:.6+Math.random()*.8,life:1,dur:650,color:'#fff',size:9+Math.random()*10});
      r.wob=(r.wob||0)+dt*timeScale*.0011;r.vx+=(Math.sin(r.wob*2.1+r.i)*.9+Math.sin(r.wob*3.7+r.i*2)*.5)*.06*f;r.vx*=.93;r.x+=r.vx*f;
      if(r.x<-ROAD+22){r.x=-ROAD+22;r.vx=Math.abs(r.vx);}if(r.x>ROAD-22){r.x=ROAD-22;r.vx=-Math.abs(r.vx);}
      capyBlock(r,f);
      for(const o of obstacles){const dx=r.x-o.x,dd=r.d-o.d;const dist=Math.hypot(dx,dd);
        if(dist<o.r+16&&o.hit<1){
          if(o.kind==='manhole'||o.kind==='banana'){if($('evTrip').checked){tripRunner(r,o.kind==='banana'?'바나나!!':'맨홀!!');o.hit=1;o.hitAt=performance.now();o.kdir=dx>0?-1:1;}}
          else{r.vx+=(dx>0?1:-1)*3.2;r.speed*=.4;r.stun=300;texts.push({r,text:o.kind==='cart'?'죄송해요!!':'쓰레기통!!',color:o.kind==='cart'?'#ff9ad5':'#7ed957',life:.9});obstacleBump(o,dx);beep(240,.15,'square',.12);puff(o.x,o.d,8,'#ddd');}
        }
      }
    }
    if($('evPush').checked){
      for(let a=0;a<alive.length;a++)for(let b=a+1;b<alive.length;b++){const p=alive[a],q=alive[b];const dx=q.x-p.x,dd=q.d-p.d,dist=Math.hypot(dx,dd);
        if(dist<34&&dist>0){const nx=dx/dist,ov=(34-dist)*.5;p.x-=nx*ov;q.x+=nx*ov;
          const back=p.d<q.d?p:q,front=back===p?q:p;
          if(Math.abs(dd)<22){front.speed*=.86;back.speed*=1.05;front.vx+=(front.x>back.x?1:-1)*1.2;
